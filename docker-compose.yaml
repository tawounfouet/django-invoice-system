services:
  web:
    restart: always
    build: .
    command: "sh run.sh"
    expose:
      - "8000"
    volumes:
      - .:/invoice
    env_file:
      - ".env"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - default

  db:
    image: postgres:15
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
    networks:
      - default

  redis:
    restart: always
    image: "redis:6.2.2-alpine"
    networks:
      - default

  celery:
    restart: always
    build: .
    command: celery -A django_invoice worker -l info -B --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/invoice
    env_file:
      - ".env"
    depends_on:
      - redis
      - db
      - web
    networks:
      - default

networks:
  default:
